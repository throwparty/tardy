[workspace]
resolver = "2"
members = ["crates/tardy"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
icalendar = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
zbus = "5"
iced = { version = "0.14", default-features = false, features = ["tokio", "tiny-skia", "wayland", "web-colors"] }
iced_layershell = { version = "0.19", default-features = false }
rrule = "0.14"
